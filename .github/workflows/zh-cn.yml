name: WLED 简体中文固件

on:
  push:
    branches: [zh-cn-16.0.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: 编译 ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        environment: [nodemcuv2, esp32dev]
    steps:
      - name: 检出汉化源码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 缓存 PlatformIO 下载
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: zh-cn-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'requirements.txt') }}
      - name: 安装依赖
        run: |
          npm ci
          pip install -r requirements.txt
      - name: 检查汉化与网页构建工具
        run: npm test
      - name: 打包中文网页资源
        run: npm run build -- --force
      - name: 编译固件
        env:
          BUILD_ENV: ${{ matrix.environment }}
        run: pio run -e "$BUILD_ENV"
      - name: 生成 ESP32 首刷合并镜像
        if: matrix.environment == 'esp32dev'
        run: |
          pip install esptool==5.1.0
          python tools/merge-esp32.py
      - name: 生成校验和
        run: |
          cd build_output/release
          find . -maxdepth 1 -type f \( -name '*.bin' -o -name '*.bin.gz' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: 上传固件和刷写说明
        uses: actions/upload-artifact@v4
        with:
          name: WLED-16.0.1-zh-CN.1-${{ matrix.environment }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build_output/release/*.bin
            build_output/release/*.bin.gz
            build_output/release/SHA256SUMS.txt
            docs/001-*.md
# AI: end
